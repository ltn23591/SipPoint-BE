        4. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.

        > **Tồn kho theo công thức (Giai đoạn 2):** Khi tạo đơn, nguyên liệu của sản phẩm có
        > công thức được **tạm giữ (Hold)**. Đơn `COMPLETED` sẽ **trừ kho chính thức (Commit)**;
        > đơn bị hủy sẽ **hoàn tác (Rollback)** phần tạm giữ; đơn `REFUNDED` sẽ **hoàn kho**.
        > Sản phẩm không có công thức vẫn dùng cơ chế `product.stock` như cũ.
