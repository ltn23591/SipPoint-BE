        "400":
          description: Đơn hàng chưa hoàn thành, đã hoàn trả trước đó, hoặc thiếu lý do
      description: |-
        Chỉ áp dụng cho đơn hàng ở trạng thái **COMPLETED** (quyền Admin/Thu ngân).
        Hệ thống tự động: chuyển trạng thái sang REFUNDED, trừ lại số điểm đã cộng khi hoàn thành đơn
        (nếu khách đã tiêu bớt điểm thì trừ tối đa bằng số dư), trừ điểm chu kỳ xét hạng,
        và hoàn lại voucher đã sử dụng cho đơn.
  /api/v1/vouchers/search:
    get:
      summary: Lấy danh sách tất cả voucher
      tags:
        - Voucher
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lấy danh sách voucher thành công
  /api/v1/vouchers/create:
    post:
      summary: Tạo voucher mới
      tags:
        - Voucher
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - title
                - discountType
                - discountValue
                - endDate
                - usageLimit
              properties:
                code:
                  type: string
                  description: Mã voucher (tự động chuyển chữ hoa, duy nhất)
                  example: SINHNHAT30
                title:
                  type: string
                  example: Giảm 30.000đ mừng sinh nhật
                description:
                  type: string
                discountType:
                  type: string
                  enum:
                    - PERCENT
                    - FIXED
                discountValue:
                  type: number
                  example: 30000
                minOrderValue:
                  type: number
                  description: Giá trị đơn hàng tối thiểu để áp dụng
                  example: 100000
                maxDiscountLimit:
                  type: number
                  description: Mức giảm tối đa (dùng cho loại PERCENT)
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                usageLimit:
                  type: number
                  description: Tổng số lượng phát hành tối đa
                  example: 100
                pointsCost:
                  type: number
                  description: Số điểm cần để đổi voucher này (> 0 = cho phép khách đổi điểm lấy voucher)
                  example: 20
                perCustomerLimit:
                  type: number
                  description: Giới hạn số lần một khách được dùng/đổi voucher này (0 = không giới hạn)
                  example: 1
      responses:
        "201":
          description: Tạo voucher thành công
