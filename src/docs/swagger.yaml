      summary: Upload ảnh từ URL lên Cloudinary
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL của ảnh cần upload
                folder:
