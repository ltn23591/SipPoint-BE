paths:
  /api/v1/health:
    get:
      summary: Kiểm tra trạng thái hoạt động của Server (Health Check)
      tags: [System]
      responses:
        200:
          description: Server hoạt động bình thường

  /api/v1/auth/customer/register:
    post:
      summary: Đăng ký tài khoản Khách hàng mới
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - phone
                - password
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: Đăng ký thành công và nhận cookie token
        400:
          description: Lỗi dữ liệu

  /api/v1/auth/customer/login:
    post:
      summary: Đăng nhập Khách hàng (bằng Số điện thoại hoặc Email)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
                - password
              properties:
                loginIdentifier:
                  type: string
                  description: Số điện thoại hoặc Email của khách hàng
                password:
                  type: string
      responses:
        200:
          description: Đăng nhập thành công và nhận cookie token
        401:
          description: Sai thông tin đăng nhập

  /api/v1/auth/customer/verify-email:
    post:
      summary: Xác thực tài khoản Khách hàng bằng OTP qua Email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        200:
          description: Xác thực thành công và tự động đăng nhập (nhận token)
        400:
          description: Lỗi OTP hoặc tài khoản đã xác thực

  /api/v1/auth/verify-email:
    post:
      summary: Xác thực tài khoản Khách hàng bằng OTP qua Email (Alias đường dẫn gốc)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        200:
          description: Xác thực thành công và tự động đăng nhập (nhận token)
        400:
          description: Lỗi OTP hoặc tài khoản đã xác thực

  /api/v1/auth/customer/resend-verify-email:
    post:
      summary: Gửi lại mã OTP xác thực Email cho Khách hàng
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        200:
          description: Gửi OTP thành công
        400:
          description: Email không hợp lệ hoặc tài khoản đã xác thực

  /api/v1/auth/resend-verify-email:
    post:
      summary: Gửi lại mã OTP xác thực Email cho Khách hàng (Alias đường dẫn gốc)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        200:
          description: Gửi OTP thành công
        400:
          description: Email không hợp lệ hoặc tài khoản đã xác thực

  /api/v1/auth/login:
    post:
      summary: Đăng nhập Nhân viên (Admin, Cashier, Barista, Waiter)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Đăng nhập thành công và nhận cookie token
        401:
          description: Sai thông tin đăng nhập

  /api/v1/auth/logout:
    get:
      summary: Đăng xuất (xóa cookie)
      tags: [Auth]
      responses:
        200:
          description: Đăng xuất thành công

  /api/v1/auth/me:
    get:
      summary: Lấy thông tin tài khoản đang đăng nhập
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Thông tin user
        401:
          description: Chưa đăng nhập

  /api/v1/auth/2fa/enable:
    post:
      summary: Bật cấu hình 2FA (Gửi mã OTP qua email)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Đã gửi mã OTP qua email

  /api/v1/auth/2fa/verify-enable:
    post:
      summary: Xác nhận OTP để chính thức BẬT 2FA
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
      responses:
        200:
          description: Kích hoạt 2FA thành công

  /api/v1/auth/2fa/login:
    post:
      summary: Nhập mã OTP để đăng nhập khi có 2FA
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        200:
          description: Đăng nhập thành công, trả về token

  /api/v1/auth/2fa/disable:
    post:
      summary: Tắt tính năng bảo mật 2 lớp
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Tắt 2FA thành công

  /api/v1/auth/forgot-password:
    post:
      summary: Yêu cầu khôi phục mật khẩu Nhân viên (Gửi mã OTP)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Mã OTP đã được gửi và trả về activationToken

  /api/v1/auth/verify-otp:
    post:
      summary: Xác thực mã OTP và sinh Reset Token cho nhân viên
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - activation_token
                - activation_code
              properties:
                activation_token:
                  type: string
                  description: Token nhận từ API forgot-password
                activation_code:
                  type: string
                  description: Mã OTP 6 số gửi qua Email
      responses:
        200:
          description: OTP xác minh thành công và nhận resetToken

  /api/v1/auth/reset-password:
    post:
      summary: Đặt lại mật khẩu nhân viên với Reset Token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - newPassword
              properties:
                resetToken:
                  type: string
                  description: Reset token nhận được từ API verify-otp
                newPassword:
                  type: string
                  minLength: 6
                  description: Mật khẩu mới (tối thiểu 6 ký tự)
      responses:
        200:
          description: Đặt lại mật khẩu thành công

  /api/v1/export/employees:
    get:
      summary: Xuất danh sách nhân viên ra Excel
      tags: [Exports]
      security:
        - bearerAuth: []
      responses:
        200:
          description: File excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/v1/upload/local:
    post:
      summary: Tải lên một hình ảnh (Lưu local)
      tags: [Uploads]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        200:
          description: Tải lên thành công

  /api/v1/upload/cloudinary/url:
    post:
      summary: Upload ảnh từ URL lên Cloudinary
      tags: [Uploads]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL của ảnh cần upload
                folder:
                  type: string
                  description: Thư mục lưu trữ trên Cloudinary (tùy chọn)
      responses:
        200:
          description: Upload thành công
        400:
          description: Thiếu URL

  /api/v1/upload/cloudinary/file:
    post:
      summary: Upload ảnh từ file lên Cloudinary
      tags: [Uploads]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File ảnh cần upload
                folder:
                  type: string
                  description: Thư mục lưu trữ trên Cloudinary (tùy chọn)
      responses:
        200:
          description: Upload thành công
        400:
          description: Thiếu file

  /api/v1/employees:
    get:
      summary: Lấy danh sách tất cả nhân viên
      tags: [Employees]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Danh sách nhân viên
    post:
      summary: Tạo nhân viên mới (Admin thêm tài khoản)
      tags: [Employees]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  description: 'Quyền: admin, cashier, barista, staff'
                  enum: ["admin", "cashier", "barista", "staff"]
                status:
                  type: string
                  description: 'Trạng thái hoạt động'
                  enum: ["pending", "active", "banned"]
                  default: active
      responses:
        201:
          description: Tạo thành công
        400:
          description: Lỗi dữ liệu

  /api/v1/employees/{id}:
    get:
      summary: Lấy thông tin chi tiết một nhân viên
      tags: [Employees]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của nhân viên
      responses:
        200:
          description: Thông tin nhân viên
        404:
          description: Không tìm thấy
    put:
      summary: Cập nhật thông tin nhân viên (phân quyền / đổi thông tin)
      tags: [Employees]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của nhân viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  description: 'Quyền: admin, cashier, barista, staff'
                  enum: ["admin", "cashier", "barista", "staff"]
                status:
                  type: string
                  description: 'Trạng thái hoạt động'
                  enum: ["pending", "active", "banned"]
      responses:
        200:
          description: Cập nhật thành công
        404:
          description: Không tìm thấy
    delete:
      summary: Xóa nhân viên
      tags: [Employees]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của nhân viên
      responses:
        200:
          description: Xóa thành công
        404:
          description: Không tìm thấy

  /api/v1/categories:
    get:
      summary: Lấy danh sách category
      tags: [Category]
      responses:
        200:
          description: Danh sách category
    post:
      summary: Tạo mới category
      tags: [Category]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        201:
          description: Tạo thành công

  /api/v1/categories/{id}:
    get:
      summary: Lấy chi tiết một category
      tags: [Category]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của category
      responses:
        200:
          description: Chi tiết category
        404:
          description: Không tìm thấy
    put:
      summary: Cập nhật category
      tags: [Category]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Cập nhật thành công
        404:
          description: Không tìm thấy
    delete:
      summary: Xóa category
      tags: [Category]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của category
      responses:
        200:
          description: Xóa thành công
        404:
          description: Không tìm thấy

  /api/v1/products:
    get:
      summary: Lấy danh sách product
      tags: [Product]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Số trang
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Số item mỗi trang
        - in: query
          name: keyword
          schema:
            type: string
          description: Tìm kiếm theo tên
        - in: query
          name: category
          schema:
            type: string
          description: Lọc theo ID danh mục
      responses:
        200:
          description: Danh sách product
    post:
      summary: Tạo mới product
      tags: [Product]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        201:
          description: Tạo thành công

  /api/v1/products/{id}:
    get:
      summary: Lấy chi tiết một product
      tags: [Product]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của product
      responses:
        200:
          description: Chi tiết product
        404:
          description: Không tìm thấy
    put:
      summary: Cập nhật product
      tags: [Product]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của product
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        200:
          description: Cập nhật thành công
        404:
          description: Không tìm thấy
    delete:
      summary: Xóa product
      tags: [Product]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của product
      responses:
        200:
          description: Xóa thành công
        404:
          description: Không tìm thấy

  /api/v1/customers:
    get:
      summary: Lấy danh sách khách hàng (có phân trang và lọc)
      tags: [Customer]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: tier
          schema:
            type: string
      responses:
        200:
          description: Danh sách khách hàng
    post:
      summary: Tạo khách hàng mới
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        201:
          description: Tạo thành công

  /api/v1/customers/{id}:
    get:
      summary: Lấy chi tiết khách hàng
      tags: [Customer]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        200:
          description: Chi tiết khách hàng
        404:
          description: Không tìm thấy
    put:
      summary: Cập nhật thông tin khách hàng
      tags: [Customer]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        200:
          description: Cập nhật thành công
        404:
          description: Không tìm thấy

  /api/v1/customers/{id}/points:
    post:
      summary: Cộng / Trừ điểm khách hàng
      tags: [Customer]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pointsChange
                - transactionType
              properties:
                pointsChange:
                  type: number
                  description: Điểm thay đổi (+ hoặc -)
                title:
                  type: string
                  description: Tiêu đề giao dịch
                description:
                  type: string
                  description: Mô tả chi tiết
                transactionType:
                  type: string
                  enum: ["ORDER", "REWARD", "BIRTHDAY_GIFT", "ADJUSTMENT"]
      responses:
        200:
          description: Thay đổi điểm thành công

  /api/v1/zones:
    get:
      summary: Lấy danh sách khu vực
      tags: [Zone]
      responses:
        200:
          description: Danh sách khu vực
    post:
      summary: Tạo mới khu vực
      tags: [Zone]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Tên khu vực (ví dụ Tầng 1)
                description:
                  type: string
                  description: Mô tả khu vực
                isActive:
                  type: string
                  enum: ["active", "inactive"]
                  default: active
      responses:
        201:
          description: Tạo khu vực thành công

  /api/v1/zones/{id}:
    get:
      summary: Lấy chi tiết một khu vực
      tags: [Zone]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID khu vực
      responses:
        200:
          description: Chi tiết khu vực
        404:
          description: Không tìm thấy
    put:
      summary: Cập nhật khu vực
      tags: [Zone]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID khu vực
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                isActive:
                  type: string
                  enum: ["active", "inactive"]
      responses:
        200:
          description: Cập nhật thành công
        404:
          description: Không tìm thấy
    delete:
      summary: Xóa khu vực
      tags: [Zone]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID khu vực
      responses:
        200:
          description: Xóa thành công
        404:
          description: Không tìm thấy

  /api/v1/tables:
    get:
      summary: Lấy danh sách bàn
      tags: [Table]
      parameters:
        - in: query
          name: zoneId
          schema:
            type: string
          description: Lọc bàn theo ID khu vực
      responses:
        200:
          description: Danh sách bàn
    post:
      summary: Tạo mới bàn
      tags: [Table]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - zoneId
              properties:
                name:
                  type: string
                  description: Tên bàn (ví dụ Bàn 1)
                zoneId:
                  type: string
                  description: ID của khu vực trực thuộc
                status:
                  type: string
                  enum: ["available", "occupied", "reserved", "cleaning"]
                  default: available
                isActive:
                  type: string
                  enum: ["active", "inactive"]
                  default: active
      responses:
        201:
          description: Tạo bàn thành công

  /api/v1/tables/{id}:
    get:
      summary: Lấy chi tiết bàn
      tags: [Table]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID bàn
      responses:
        200:
          description: Chi tiết bàn
        404:
          description: Không tìm thấy
    put:
      summary: Cập nhật bàn (Đổi tên, khu vực hoặc cập nhật trạng thái Bàn trống/Có khách/Đặt trước)
      tags: [Table]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID bàn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                zoneId:
                  type: string
                status:
                  type: string
                  enum: ["available", "occupied", "reserved", "cleaning"]
                isActive:
                  type: string
                  enum: ["active", "inactive"]
      responses:
        200:
          description: Cập nhật thành công
        404:
          description: Không tìm thấy
    delete:
      summary: Xóa bàn
      tags: [Table]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID bàn
      responses:
        200:
          description: Xóa thành công
        404:
          description: Không tìm thấy

  /api/v1/tables/{id}/qrcode:
    post:
      summary: Tạo lại/cập nhật mã QR Code của bàn
      tags: [Table]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID bàn
      responses:
        200:
          description: Tạo thành công
        404:
          description: Không tìm thấy

tags:
  - name: Auth
    description: API Quản lý Xác thực
  - name: Exports
    description: API Xuất dữ liệu
  - name: Uploads
    description: API Upload File (Hỗ trợ Local & Cloudinary)
  - name: Users
    description: API Quản lý Người Dùng (Cần quyền Admin)

  - name: Category
    description: API quản lý category

  - name: Product
    description: API quản lý product

  - name: Customer
    description: API Quản lý Khách hàng
  - name: Zone
    description: API Quản lý Khu vực (Bàn ăn)
  - name: Table
    description: API Quản lý Bàn và sinh mã QR Code

components:
  schemas:
    User:
      type: object
      required:
        - name
        - email
        - password
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: ["admin", "cashier", "barista", "staff"]
          default: staff
        status:
          type: string
          enum: ["pending", "active", "banned"]
          description: 'Trạng thái hoạt động'
          default: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductInput:
      type: object
      required:
        - name
        - description
        - price
        - image
        - category
      properties:
        name:
          type: string
          description: Tên sản phẩm
        description:
          type: string
          description: Mô tả chi tiết
        price:
          type: number
          description: Giá bán
        image:
          type: string
          description: Ảnh chính (Public ID của Cloudinary hoặc URL)
        images:
          type: array
          items:
            type: string
          description: Danh sách ảnh phụ
        category:
          type: string
          description: ID của Danh mục
        stock:
          type: number
          default: 0
        isActive:
          type: string
          enum: ["active", "inactive"]
          default: active
        variants:
          type: string
          description: "Danh sách biến thể dạng JSON string (Ví dụ: '[{\"variantType\": 0, \"name\": \"Size L\", \"priceAdjustment\": 5000}]')"
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        image:
          type: string
        images:
          type: array
          items:
            type: string
        category:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
        stock:
          type: number
        rating:
          type: number
        numReviews:
          type: number
        isActive:
          type: number
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerInput:
      type: object
      required:
        - fullName
        - phone
      properties:
        fullName:
          type: string
          description: Tên đầy đủ
        email:
          type: string
          description: Email khách hàng
        phone:
          type: string
          description: Số điện thoại
        dateOfBirth:
          type: string
          format: date
          description: Ngày sinh

    ProductVariant:
      type: object
      required:
        - product
        - variantType
        - name
        - priceAdjustment
      properties:
        _id:
          type: string
        product:
          type: string
          description: ID của sản phẩm gốc
        variantType:
          type: string
          enum: ["size", "topping"]
          description: 'Loại biến thể (size hoặc topping)'
        name:
          type: string
          description: Tên biến thể (ví dụ Size L, Trân châu đen)
        priceAdjustment:
          type: number
          description: Giá tiền tăng/giảm thêm khi chọn biến thể này
        isActive:
          type: string
          enum: ["active", "inactive"]
          default: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VoucherInput:
      type: object
      required:
        - code
        - title
        - discountType
        - discountValue
        - endDate
        - usageLimit
      properties:
        code:
          type: string
          description: Mã code viết hoa (VD VIPCOFFEE)
        title:
          type: string
          description: Tiêu đề Voucher (VD Giảm 30K)
        description:
          type: string
          description: Mô tả khuyến mãi
        discountType:
          type: string
          enum: ["PERCENT", "FIXED"]
          description: 'Loại giảm giá (PERCENT hoặc FIXED)'
          default: PERCENT
        discountValue:
          type: number
          description: Giá trị phần trăm (0-100) hoặc số tiền cố định được giảm
        minOrderValue:
          type: number
          description: Trị giá đơn hàng tối thiểu
        maxDiscountLimit:
          type: number
          description: Số tiền giảm tối đa (nếu dùng PERCENTAGE)
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        usageLimit:
          type: number
          description: Tổng số lượng mã phát hành
        isActive:
          type: string
          enum: ["active", "inactive"]
          default: active

    OTP:
      type: object
      required:
        - userId
        - userModel
        - code
        - type
      properties:
        userId:
          type: string
          description: ID của người dùng sở hữu OTP (Employee hoặc Customer)
        userModel:
          type: string
          enum: ["Employee", "Customer"]
          description: Model người dùng tương ứng
          example: Employee
        code:
          type: string
          description: Mã OTP (ví dụ 6 chữ số)
          example: "123456"
        type:
          type: string
          enum: ["register", "two_factor", "reset_password"]
          description: 'Loại mã xác thực OTP (Ví dụ: register, two_factor, reset_password)'
          example: register
