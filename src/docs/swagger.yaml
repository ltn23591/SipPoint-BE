        "400":
          description: >-
            Không đủ nguyên liệu để phục vụ (với sản phẩm có công thức). Hệ thống tự
            tạm giữ (hold) nguyên liệu theo công thức; nếu thiếu sẽ chuyển sản phẩm sang
