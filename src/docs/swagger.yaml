              type: object
              required:
                - status
              properties:
                id:
                  type: string
                  description: ID đơn hàng (Tùy chọn)
                orderId:
                  type: string
                  description: ID đơn hàng (Tùy chọn thay thế)
                status:
                  type: string
                  description: "Trạng thái mới: PENDING, CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED"
      responses:
        "200":
          description: Cập nhật trạng thái đơn hàng thành công
        "404":
          description: Không tìm thấy đơn hàng
      description: |-
        ### Cách kiểm thử (How to test):

        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.

        2. Nhấp chọn nút **Try it out** ở góc phải của API.

        3. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.

        4. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/products/import:
    post:
      summary: Nhập danh sách sản phẩm từ file Excel (Admin)
      tags:
        - Product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel chứa danh sách sản phẩm
      responses:
        "200":
          description: Import thành công
        "400":
          description: Lỗi file hoặc định dạng
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu quyền Admin**: Cần đăng nhập tài khoản Admin và lấy Token dán vào nút **Authorize** ở trên cùng bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Chọn file tải lên trong phần **Request Body**.
        4. Nhấp **Execute** để gửi yêu cầu.
  /api/v1/shifts/search:
    get:
      summary: Lấy danh sách shift
      tags: [Shift]
      responses:
        200:
          description: Danh sách shift
  /api/v1/shifts/open:
    post:
      summary: Mở ca làm việc mới
      tags: [Shift]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeId
              properties:
                employeeId:
                  type: string
                  description: ID nhân viên
                startingCash:
                  type: number
                  description: Tiền mặt đầu ca
      responses:
        201:
          description: Mở ca thành công
  
  /api/v1/shifts/{id}/detail:
    get:
      summary: Lấy chi tiết một ca làm việc
      tags: [Shift]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của ca làm việc
      responses:
        200:
          description: Chi tiết ca làm việc
        404:
          description: Không tìm thấy
  
  /api/v1/shifts/{id}/close:
    put:
      summary: Đóng ca làm việc
      tags: [Shift]
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của ca làm việc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actualEndingCash:
                  type: number
                  description: Tiền mặt thực tế khi đóng ca
                note:
                  type: string
                  description: Ghi chú nếu có sai sót
      responses:
        200:
          description: Đóng ca thành công
        404:
          description: Không tìm thấy
          
tags:
  - name: Product
    description: API Quản lý Sản Phẩm (Món ăn / Đồ uống)
  - name: Auth
    description: API Quản lý Xác thực
  - name: Exports
    description: API Xuất dữ liệu
  - name: Uploads
    description: API Upload File (Hỗ trợ Local & Cloudinary)
  - name: Users
    description: API Quản lý Người Dùng (Cần quyền Admin)
  - name: Order
    description: API Quản lý Đơn hàng & Vận hành (Real-time)
  - name: Category
    description: API quản lý category
  - name: Product
    description: API quản lý product
  - name: Customer
    description: API Quản lý Khách hàng
  - name: Zone
    description: API Quản lý Khu vực (Bàn ăn)
  - name: Table
    description: API Quản lý Bàn và sinh mã QR Code
  - name: Shift
    description: API quản lý shift

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - name
        - email
        - password
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          description: 'Quyền hạn: "admin" (Quản trị viên), "cashier" (Thu ngân), "barista" (Pha chế), "staff" (Phục vụ/Nhân viên)'
          enum:
            - admin
            - cashier
            - barista
            - staff
          default: staff
        status:
          type: string
          description: 'Trạng thái hoạt động: "pending" (Chờ kích hoạt), "active" (Đang hoạt động), "banned" (Bị cấm)'
          enum:
            - pending
            - active
            - banned
          default: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductInput:
      type: object
      required:
        - name
        - description
        - price
        - image
        - category
      properties:
        name:
          type: string
          description: Tên sản phẩm
        description:
          type: string
          description: Mô tả chi tiết
        price:
          type: number
          description: Giá bán
        image:
          type: string
          description: Ảnh chính (Public ID của Cloudinary hoặc URL)
        images:
          type: array
          items:
            type: string
          description: Danh sách ảnh phụ
        category:
          type: string
          description: ID của Danh mục
        stock:
          type: number
          default: 0
        isActive:
          type: string
          description: 'Trạng thái hoạt động: "active" (Hoạt động/Kích hoạt), "inactive" (Tắt/Ngừng hoạt động)'
          enum:
            - active
            - inactive
          default: active
        variants:
          type: string
          description: "Danh sách biến thể dạng JSON string (Ví dụ: '[{\"variantType\": 0, \"name\": \"Size L\", \"priceAdjustment\": 5000}]')"
    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        image:
          type: string
        images:
          type: array
          items:
            type: string
        category:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
        stock:
          type: number
        rating:
          type: number
        numReviews:
          type: number
        isActive:
          type: string
          description: 'Trạng thái hoạt động: "active" (Hoạt động/Kích hoạt), "inactive" (Tắt/Ngừng hoạt động)'
          enum:
            - active
            - inactive
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CustomerInput:
      type: object
      required:
        - fullName
        - phone
      properties:
        fullName:
          type: string
          description: Tên đầy đủ
        email:
          type: string
          description: Email khách hàng
        phone:
          type: string
          description: Số điện thoại
        dateOfBirth:
          type: string
          format: date
          description: Ngày sinh
    ProductVariant:
      type: object
      required:
        - product
        - variantType
        - name
        - priceAdjustment
      properties:
        _id:
          type: string
        product:
          type: string
          description: ID của sản phẩm gốc
        variantType:
          type: string
          description: 'Loại biến thể: "size" (Kích thước), "topping" (Topping/Món thêm)'
          enum:
            - size
            - topping
        name:
          type: string
          description: Tên biến thể (ví dụ Size L, Trân châu đen)
        priceAdjustment:
          type: number
          description: Giá tiền tăng/giảm thêm khi chọn biến thể này
        isActive:
          type: string
          description: 'Trạng thái hoạt động: "active" (Hoạt động/Kích hoạt), "inactive" (Tắt/Ngừng hoạt động)'
          enum:
            - active
            - inactive
          default: active
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VoucherInput:
      type: object
      required:
        - code
        - title
        - discountType
        - discountValue
        - endDate
        - usageLimit
      properties:
        code:
          type: string
          description: Mã code viết hoa (VD VIPCOFFEE)
        title:
          type: string
          description: Tiêu đề Voucher (VD Giảm 30K)
        description:
          type: string
          description: Mô tả khuyến mãi
        discountType:
          type: string
          description: 'Loại giảm giá: "PERCENT" (Giảm theo %), "FIXED" (Giảm theo số tiền cố định)'
          enum:
            - PERCENT
            - FIXED
          default: PERCENT
        discountValue:
          type: number
          description: Giá trị phần trăm (0-100) hoặc số tiền cố định được giảm
        minOrderValue:
          type: number
          description: Trị giá đơn hàng tối thiểu
        maxDiscountLimit:
          type: number
          description: Số tiền giảm tối đa (nếu dùng PERCENTAGE)
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        usageLimit:
          type: number
          description: Tổng số lượng mã phát hành
        isActive:
          type: string
          description: 'Trạng thái hoạt động: "active" (Hoạt động/Kích hoạt), "inactive" (Tắt/Ngừng hoạt động)'
          enum:
            - active
            - inactive
          default: active
    OTP:
      type: object
      required:
        - userId
        - userModel
        - code
        - type
      properties:
        userId:
          type: string
          description: ID của người dùng sở hữu OTP (Employee hoặc Customer)
        userModel:
          type: string
          description: 'Model người dùng tương ứng: "Employee" (Nhân viên), "Customer" (Khách hàng)'
          enum:
            - Employee
            - Customer
          example: Employee
        code:
          type: string
          description: Mã OTP (ví dụ 6 chữ số)
          example: "123456"
        type:
          type: string
          description: 'Loại mã xác thực OTP: "register" (Đăng ký), "two_factor" (Bảo mật 2 lớp), "reset_password" (Khôi phục mật khẩu)'
          enum:
            - register
            - two_factor
            - reset_password
          example: register
    Store:
      type: object
      required:
        - name
      properties:
        _id:
          type: string
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        description:
          type: string
        paymentMethods:
          type: array
          items:
            type: string
            enum:
              - CASH
              - TRANSFER
              - CARD
        isActive:
          type: string
          enum:
            - active
            - inactive
          default: active
    StaffRole:
      type: object
      required:
        - name
        - code
      properties:
        _id:
          type: string
        name:
          type: string
        code:
          type: string
        permissions:
          type: array
          items:
            type: string
        description:
          type: string
    ProductPrice:
      type: object
      required:
        - productId
        - price
      properties:
        _id:
          type: string
        productId:
          type: string
        price:
          type: number
        sizePriceMap:
          type: object
          additionalProperties:
            type: number
        notes:
          type: string
    MembershipProgram:
      type: object
      required:
        - name
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isApproved:
          type: boolean
          default: false
        approvedBy:
          type: string
        createdBy:
          type: string
    MembershipTier:
      type: object
      required:
        - programId
        - name
      properties:
        _id:
          type: string
        programId:
          type: string
        name:
          type: string
        minPoints:
          type: number
          default: 0
        discountPercentage:
          type: number
          default: 0
        description:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
    PromotionProgram:
      type: object
      required:
        - name
        - discountValue
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        discountType:
          type: string
          enum:
            - PERCENT
            - FIXED
          default: PERCENT
        discountValue:
          type: number
        minOrderValue:
          type: number
          default: 0
        maxDiscountAmount:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: string
          enum:
            - active
            - inactive
          default: active
        isApproved:
          type: boolean
          default: false
    Notification:
      type: object
      required:
        - title
        - content
      properties:
        _id:
          type: string
        title:
          type: string
        content:
          type: string
        recipientType:
          type: string
          enum:
            - all
            - customer
            - staff
          default: all
        recipientId:
          type: string
        type:
          type: string
          enum:
            - system
            - promotion
            - order
          default: system
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
        isRead:
          type: boolean
          default: false
    Feedback:
      type: object
      required:
        - rating
        - comment
      properties:
        _id:
          type: string
        customerId:
          type: string
        orderId:
          type: string
        rating:
          type: number
          minimum: 1
          maximum: 5
        comment:
          type: string
        reply:
          type: string
        replyBy:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          default: pending
    ActivityLog:
      type: object
      required:
        - employeeId
        - action
      properties:
        _id:
          type: string
        employeeId:
          type: string
        action:
          type: string
        target:
          type: string
        details:
          type: string
        ipAddress:
          type: string
    Shift:
      type: object
      properties:
        _id:
          type: string
        employeeId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        startingCash:
          type: number
        actualEndingCash:
          type: number
        systemEndingCash:
          type: number
        totalRevenue:
          type: number
        totalOrders:
          type: number
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
