        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
    post:
      summary: Tạo đơn hàng mới
      tags:
        - Order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                tableId:
                  type: string
                  description: ID của bàn (nếu ngồi tại bàn)
                customerId:
                  type: string
                  description: ID của khách hàng (nếu có thẻ thành viên)
                promotionCode:
                  type: string
                  description: Mã giảm giá áp dụng (nếu có)
                note:
                  type: string
                  description: Ghi chú cho toàn bộ đơn hàng
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - qty
                    properties:
                      productId:
                        type: string
                      qty:
                        type: integer
                        minimum: 1
                      note:
                        type: string
                      variants:
                        type: array
                        items:
                          type: object
                          required:
                            - variantId
                          properties:
                            variantId:
                              type: string
      responses:
        "201":
          description: Đặt đơn hàng thành công
      description: |-
