openapi: 3.0.0
info:
  title: Node.js Express API Documentation (JavaScript)
  version: 1.0.0
  description: |
    ### Hướng dẫn kiểm thử API trên Swagger UI:
    1. **Đăng nhập/Đăng ký để lấy Token**:
       - Sử dụng API đăng nhập nhân viên tại `/api/v1/auth/login` (hoặc `/api/v1/auth/customer/login` dành cho khách hàng).
       - Copy chuỗi `token` hoặc `accessToken` nhận được từ phản hồi thành công.
    2. **Cấu hình Authenticate**:
       - Nhấp vào nút **Authorize** màu xanh lá ở phía góc trên bên phải trang Swagger.
       - Dán trực tiếp chuỗi token vừa copy vào ô nhập liệu (không cần viết thêm từ khóa "Bearer" vì Swagger đã tự động thêm tiền tố này dựa trên cấu hình Bearer Auth).
       - Nhấp **Authorize** rồi đóng hộp thoại lại.
    3. **Tiến hành kiểm thử**:
       - Chọn API bạn muốn kiểm thử, nhấp **Try it out**, điền các tham số hoặc Request Body rồi nhấp **Execute** để xem kết quả trả về.
servers:
  - url: /
    description: Default Server (Dynamic)
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Kiểm tra trạng thái hoạt động của Server (Health Check)
      tags:
        - System
      responses:
        "200":
          description: Server hoạt động bình thường
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/customer/register:
    post:
      summary: Đăng ký tài khoản Khách hàng mới
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - phone
                - password
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Đăng ký thành công và nhận cookie token
        "400":
          description: Lỗi dữ liệu
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/customer/login:
    post:
      summary: Đăng nhập Khách hàng (bằng Số điện thoại hoặc Email)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
                - password
              properties:
                loginIdentifier:
                  type: string
                  description: Số điện thoại hoặc Email của khách hàng
                password:
                  type: string
      responses:
        "200":
          description: Đăng nhập thành công và nhận cookie token
        "401":
          description: Sai thông tin đăng nhập
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/customer/verify-email:
    post:
      summary: Xác thực tài khoản Khách hàng bằng OTP qua Email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        "200":
          description: Xác thực thành công và tự động đăng nhập (nhận token)
        "400":
          description: Lỗi OTP hoặc tài khoản đã xác thực
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/verify-email:
    post:
      summary: Xác thực tài khoản Khách hàng bằng OTP qua Email (Alias đường dẫn gốc)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                otp:
                  type: string
      responses:
        "200":
          description: Xác thực thành công và tự động đăng nhập (nhận token)
        "400":
          description: Lỗi OTP hoặc tài khoản đã xác thực
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/customer/resend-verify-email:
    post:
      summary: Gửi lại mã OTP xác thực Email cho Khách hàng
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
