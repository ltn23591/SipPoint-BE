  /api/v1/materials/{id}/movements:
    get:
      summary: Lịch sử biến động tồn kho của nguyên liệu
      tags:
        - Material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của nguyên liệu
        - in: query
          name: type
          schema:
            type: string
            enum: [IMPORT, ADJUSTMENT, HOLD, RELEASE, CONSUME, RESTOCK]
          description: Lọc theo loại biến động
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Danh sách bút toán biến động (sổ cái)
  /api/v1/materials/{id}/import:
    post:
      summary: Nhập kho nguyên liệu (Cần quyền Admin)
      tags:
        - Material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của nguyên liệu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: number
                  description: Số lượng nhập (> 0)
                  example: 10
                cost:
                  type: number
                  description: Giá vốn/đơn vị (tùy chọn, sẽ cập nhật lại giá vốn)
                note:
                  type: string
                  description: Ghi chú nhập kho
      responses:
        "200":
          description: Nhập kho thành công
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token Admin**.
        2. Nhập `quantity` (> 0) trong Request Body, nhấp **Execute**. Tồn kho `onHand` tăng và ghi một bút toán IMPORT.
  /api/v1/materials/{id}/adjust:
    patch:
      summary: Điều chỉnh tồn kho thủ công (kiểm kê / hao hụt - Cần quyền Admin)
      tags:
        - Material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của nguyên liệu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantityChange
              properties:
                quantityChange:
                  type: number
                  description: Lượng điều chỉnh, dương để tăng, âm để giảm (khác 0)
                  example: -3
                note:
                  type: string
                  description: Lý do điều chỉnh
      responses:
        "200":
          description: Điều chỉnh thành công
        "400":
          description: Tồn kho không đủ để trừ (chống âm kho)
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token Admin**.
        2. Nhập `quantityChange` (âm để giảm). Nếu trừ vượt tồn hiện có sẽ trả lỗi 400.
  /api/v1/materials/{id}/restore:
    patch:
      summary: Khôi phục nguyên liệu đã xóa mềm (Cần quyền Admin)
      tags:
        - Material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID của nguyên liệu
      responses:
        "200":
          description: Đã khôi phục
        "404":
          description: Không tìm thấy
  /api/v1/recipes/availability:
    get:
      summary: Khả năng phục vụ (số phần còn làm được) của danh sách sản phẩm
      description: |-
        Trả về số phần tối đa còn làm được (`makeable`) và `stockStatus` cho mỗi sản phẩm dựa trên
        tồn khả dụng của nguyên liệu trong công thức. Sản phẩm không công thức: `hasRecipe=false`, `makeable=null`.
        Dùng cho trang menu để hiển thị món hết hàng / còn làm được bao nhiêu.
        Endpoint công khai (khách vãng lai gọi được, không cần đăng nhập).
      tags:
        - Recipe
      parameters:
        - in: query
          name: productIds
          required: true
          schema:
            type: string
          description: Danh sách ID sản phẩm, phân tách bằng dấu phẩy (vd `id1,id2,id3`)
      responses:
        "200":
          description: Danh sách khả năng phục vụ theo sản phẩm
        "400":
          description: Thiếu productIds
  /api/v1/recipes/product/{productId}:
    get:
      summary: Lấy công thức của một sản phẩm
      tags:
        - Recipe
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          schema:
            type: string
          required: true
          description: ID của sản phẩm
      responses:
        "200":
          description: Công thức của sản phẩm (kèm thông tin nguyên liệu)
        "404":
          description: Sản phẩm chưa có công thức
    put:
      summary: Tạo mới / cập nhật công thức cho sản phẩm (Cần quyền Admin)
      description: |-
        Mỗi sản phẩm gắn với đúng một công thức duy nhất. Gọi lại API này để ghi đè danh sách nguyên liệu & định mức.
      tags:
        - Recipe
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          schema:
            type: string
          required: true
          description: ID của sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Lưu công thức thành công
        "404":
          description: Không tìm thấy sản phẩm hoặc nguyên liệu
    delete:
      summary: Xóa công thức của sản phẩm (Cần quyền Admin)
      tags:
        - Recipe
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          schema:
            type: string
          required: true
          description: ID của sản phẩm
      responses:
        "200":
          description: Đã xóa công thức
        "404":
          description: Sản phẩm chưa có công thức
  /api/v1/games:
    get:
      summary: "[Admin] Danh sách Trò chơi may mắn"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, PAUSED, EXPIRED, CANCELLED]
          description: Lọc theo trạng thái
        - in: query
          name: search
          schema:
            type: string
          description: Tìm theo tên trò chơi
      responses:
        "200":
          description: Lấy danh sách thành công
    post:
      summary: "[Admin] Tạo Trò chơi may mắn (trạng thái nháp)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
            example:
              name: "Vòng quay Tết 2026"
              description: "Trò chơi may mắn dịp Tết"
              endDate: "2026-12-31T23:59:59.000Z"
              startDate: "2026-02-01T00:00:00.000Z"
              timeFrom: "08:00"
              timeTo: "22:00"
              defaultTurnCount: 3
              appliedSegmentIds: ["<segmentId>"]
              rewards:
                - displayName: "Chúc may mắn"
                  type: "MESSAGE"
                  message: "Chúc bạn may mắn lần sau!"
                  isDefault: true
                - displayName: "Giảm 20%"
                  type: "VOUCHER"
                  voucherId: "<voucherId>"
                  totalReward: 100
                  quantity: 1
                  allowManyTimes: false
                - displayName: "+50 điểm"
                  type: "POINTS"
                  rewardValue: 50
                  totalReward: 200
              distributions:
                - gameRewardIndex: 1
                  segmentId: "<segmentId>"
                  rate: 10
                  maxQuantity: 50
                  displayOrder: 0
                  allowManyTimes: false
              activityConfigs:
                - activityType: "ORDER_COMPLETED"
                  turnQuantity: 1
                  dailyLimit: 3
                  isActive: true
      responses:
        "201":
          description: Tạo thành công (trạng thái DRAFT)
        "400":
          description: Lỗi dữ liệu
  /api/v1/games/{id}:
    get:
      summary: "[Admin] Chi tiết Trò chơi may mắn (đầy đủ ô thưởng / phân bổ / cấu hình)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lấy chi tiết thành công
        "404":
          description: Không tìm thấy trò chơi
    put:
      summary: "[Admin] Cập nhật Trò chơi (CHỈ khi ở trạng thái nháp)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
      responses:
        "200":
          description: Cập nhật thành công
        "400":
          description: Không phải trạng thái nháp / lỗi dữ liệu
    delete:
      summary: "[Admin] Xóa Trò chơi (CHỈ khi ở trạng thái nháp)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xóa thành công
        "400":
          description: Không phải trạng thái nháp
  /api/v1/games/{id}/publish:
    patch:
      summary: "[Admin] Xuất bản Trò chơi (DRAFT → PUBLISHED, validate đầy đủ)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xuất bản thành công
        "400":
          description: "Không hợp lệ (thiếu ô mặc định, voucher inactive, Σ phân bổ vượt kho, đã quá hạn...)"
  /api/v1/games/{id}/pause:
    patch:
      summary: "[Admin] Tạm dừng Trò chơi (PUBLISHED → PAUSED)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tạm dừng thành công
        "400":
          description: Không ở trạng thái xuất bản
  /api/v1/games/{id}/resume:
    patch:
      summary: "[Admin] Mở lại Trò chơi (PAUSED → PUBLISHED)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mở lại thành công
        "400":
          description: Không ở trạng thái tạm dừng / đã quá hạn
  /api/v1/games/{id}/cancel:
    patch:
      summary: "[Admin] Hủy Trò chơi (PUBLISHED/PAUSED → CANCELLED)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hủy thành công
        "400":
          description: Trạng thái không cho phép hủy
  /api/v1/games/available:
    get:
      summary: "[Khách hàng] Danh sách trò chơi đang mở & áp dụng cho tôi (DTO ẩn field nhạy cảm)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "Danh sách game (ẩn totalReward/isDefault/allowManyTimes/phân bổ)"
        "403":
          description: Chỉ khách hàng mới được xem
  /api/v1/games/{id}/detail:
    get:
      summary: "[Khách hàng] Chi tiết trò chơi (DTO ẩn field nhạy cảm + số lượt còn lại)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Chi tiết game dạng mobile + remainingTurns"
        "400":
          description: Trò chơi chưa mở hoặc đã kết thúc
        "403":
          description: Không thuộc nhóm áp dụng / không phải khách hàng
        "404":
          description: Không tìm thấy trò chơi
  /api/v1/games/me/rewards:
    get:
      summary: "[Khách hàng] Lịch sử trúng thưởng của tôi"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: gameId
          schema:
            type: string
          description: Lọc theo một trò chơi (tùy chọn)
      responses:
        "200":
          description: Lấy lịch sử thành công
        "403":
          description: Chỉ khách hàng mới được xem
  /api/v1/games/{id}/draw:
    post:
      summary: "[Khách hàng] Quay trò chơi (đồng bộ - trả kết quả ngay)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Kết quả quay: { prize, remainingTurns }. prize ẩn totalReward/isDefault/allowManyTimes."
        "400":
          description: Hết lượt / ngoài thời gian hoạt động / hết phần thưởng
        "403":
          description: Không thuộc nhóm áp dụng / không phải khách hàng
        "404":
          description: Không tìm thấy trò chơi
        "409":
          description: Hệ thống bận (xung đột đồng thời sau 3 lần thử)
        "429":
          description: Đang có lượt quay khác đang xử lý
  /api/v1/games/{id}/turns:
    get:
      summary: "[Khách hàng] Xem số lượt chơi của tôi (tự seed lần đầu từ defaultTurnCount)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Trả về { totalTurns, usedTurns, remainingTurns }"
        "400":
          description: Trò chơi chưa mở hoặc đã kết thúc
        "403":
          description: Chỉ khách hàng mới được xem lượt
        "404":
          description: Không tìm thấy trò chơi
  /api/v1/games/{id}/winners:
    get:
      summary: "[Admin] Danh sách trúng thưởng của trò chơi (gộp theo khách)"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
          description: Tìm theo tên / số điện thoại khách
      responses:
        "200":
          description: "Mỗi dòng: { customerId, fullName, phone, spinCount, prizeCount, lastPrizeName, lastPrizeType, lastWonAt }"
  /api/v1/games/{id}/winners/{customerId}:
    get:
      summary: "[Admin] Chi tiết phần thưởng 1 khách đã trúng trong trò chơi"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: customerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Danh sách phần thưởng: [{ displayName, type, rewardValue, message, voucher, wonAt }]"
  /api/v1/games/{id}/bonus-turn:
    post:
      summary: "[Admin] Cấp thêm lượt chơi cho một khách"
      tags:
        - LuckyGame
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - quantity
              properties:
                customerId:
                  type: string
                  description: ID khách hàng cần cấp lượt
                quantity:
                  type: integer
                  minimum: 1
                  description: Số lượt cộng thêm
            example:
              customerId: "<customerId>"
              quantity: 5
      responses:
        "200":
          description: "Cấp lượt thành công, trả về số lượt sau khi cộng"
        "400":
          description: Số lượt không hợp lệ / trò chơi đã hết hạn hoặc đã hủy
        "404":
          description: Không tìm thấy trò chơi hoặc khách hàng
tags:
  - name: Product
    description: API Quản lý Sản Phẩm (Món ăn / Đồ uống)
  - name: Auth
    description: API Quản lý Xác thực
  - name: Exports
    description: API Xuất dữ liệu
  - name: Uploads
    description: API Upload File (Hỗ trợ Local & Cloudinary)
  - name: Users
    description: API Quản lý Người Dùng (Cần quyền Admin)
  - name: Order
    description: API Quản lý Đơn hàng & Vận hành (Real-time)
  - name: Category
    description: API quản lý category
  - name: Product
    description: API quản lý product
  - name: Customer
    description: API Quản lý Khách hàng
  - name: Zone
    description: API Quản lý Khu vực (Bàn ăn)
  - name: Table
    description: API Quản lý Bàn và sinh mã QR Code
  - name: Shift
    description: API quản lý shift
  - name: AI
    description: API Chat với AI Bot - Hỗ trợ tư vấn sản phẩm dựa trên Google Gemini
  - name: Voucher
    description: API Quản lý Voucher & Đổi điểm lấy voucher
  - name: CustomerSegment
    description: API Quản lý Nhóm khách hàng mục tiêu (Segmentation) - Cần quyền Admin
  - name: Campaign
    description: API Quản lý Chiến dịch khuyến mãi - Phát voucher vào ví theo nhóm khách hàng (Cần quyền Admin)
  - name: Material
    description: API Quản lý Nguyên liệu & Kho (tồn kho, nhập kho, điều chỉnh, cảnh báo, sổ cái biến động)
  - name: Recipe
    description: API Quản lý Công thức sản phẩm (định mức nguyên liệu - mỗi sản phẩm một công thức)
  - name: LuckyGame
    description: API Quản lý Trò chơi may mắn - cấu hình ô thưởng, phân bổ theo nhóm KH, vòng đời DRAFT/PUBLISHED/PAUSED/EXPIRED/CANCELLED (Cần quyền Admin)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GameRewardInput:
      type: object
      required:
        - displayName
        - type
      properties:
        displayName:
          type: string
          example: "Giảm 20%"
        type:
          type: string
          enum: [VOUCHER, POINTS, MESSAGE]
        voucherId:
          type: string
          description: Bắt buộc khi type=VOUCHER (voucher phải đang active)
        rewardValue:
          type: number
          description: Bắt buộc khi type=POINTS (số điểm > 0)
        message:
          type: string
          description: Lời chúc khi type=MESSAGE
        description:
          type: string
        totalReward:
          type: integer
          description: Tổng kho ô (remainingReward khởi tạo = giá trị này)
          example: 100
        quantity:
          type: integer
          default: 1
        isDefault:
          type: boolean
          description: Ô mặc định (đúng 1/ game, phải là MESSAGE, tự ép allowManyTimes=true)
        allowManyTimes:
          type: boolean
          default: true
    GameDistributionInput:
      type: object
      required:
        - gameRewardIndex
        - segmentId
        - rate
        - maxQuantity
      properties:
        gameRewardIndex:
          type: integer
          description: Vị trí ô trong mảng rewards (0-based)
        segmentId:
          type: string
          description: Nhóm KH (phải nằm trong appliedSegmentIds)
        rate:
          type: number
          description: Tỉ lệ trúng (%) 0-100
        maxQuantity:
          type: integer
        dateFrom:
          type: string
          format: date-time
        dateTo:
          type: string
          format: date-time
        displayOrder:
          type: integer
          default: 0
        allowManyTimes:
          type: boolean
