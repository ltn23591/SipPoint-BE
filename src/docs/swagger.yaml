      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token Admin** (dán vào nút **Authorize**).
        2. Nhấp **Try it out**, nhập thông tin nguyên liệu trong Request Body.
        3. Nhấp **Execute**. Nếu `onHand` > 0 sẽ tự sinh một bút toán nhập kho.
