                customerId:
                  type: string
                  description: ID của khách hàng (nếu có thẻ thành viên)
                voucherCode:
                  type: string
                  description: Mã giảm giá public áp dụng (nếu có, không dùng chung với customerVoucherId)
                customerVoucherId:
                  type: string
                  description: ID voucher trong ví khách hàng - từ campaign hoặc đổi điểm (yêu cầu customerId, không dùng chung với voucherCode)
                note:
                  type: string
