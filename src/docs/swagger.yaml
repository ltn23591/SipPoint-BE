  /api/v1/orders:
    get:
      summary: Lấy danh sách tất cả đơn hàng (Phân trang & Lọc)
      tags:
        - Order
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
          description: "Trạng thái đơn: PENDING, CONFIRMED, PREPARING, READY, COMPLETED, CANCELLED"
        - in: query
          name: tableId
          schema:
            type: string
          description: ID của bàn
        - in: query
          name: customerId
          schema:
            type: string
          description: ID của khách hàng
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Danh sách đơn hàng
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.
