        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/logout:
    get:
      summary: Đăng xuất (xóa cookie)
      tags:
        - Auth
      responses:
        "200":
          description: Đăng xuất thành công
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/me:
    get:
      summary: Lấy thông tin tài khoản đang đăng nhập
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thông tin user
        "401":
          description: Chưa đăng nhập
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/2fa/enable:
    post:
      summary: Bật cấu hình 2FA (Gửi mã OTP qua email)
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đã gửi mã OTP qua email
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
