        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        4. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/upload/cloudinary/file:
    post:
      summary: Upload ảnh từ file lên Cloudinary
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File ảnh cần upload
                folder:
                  type: string
                  description: Thư mục lưu trữ trên Cloudinary (tùy chọn)
      responses:
        "200":
          description: Upload thành công
        "400":
          description: Thiếu file
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        4. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/employees:
    get:
      summary: Lấy danh sách tất cả nhân viên
      tags:
        - Employees
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách nhân viên
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu quyền Admin**: Cần đăng nhập tài khoản Admin và lấy Token dán vào nút **Authorize** ở trên cùng bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
    post:
      summary: Tạo nhân viên mới (Admin thêm tài khoản)
      tags:
        - Employees
      security:
