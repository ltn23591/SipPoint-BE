        code:
          type: string
          description: Mã nguyên liệu / SKU (tùy chọn, không trùng)
          example: MILK-01
        unit:
          type: string
          description: Đơn vị tính riêng (kg, g, l, ml, chai, gói...)
          example: l
        onHand:
          type: number
          description: Tồn kho ban đầu (chỉ dùng khi tạo mới)
          example: 20
        minThreshold:
          type: number
          description: Ngưỡng cảnh báo sắp hết / điểm đặt lại hàng
          example: 5
        cost:
          type: number
          description: Giá vốn trên một đơn vị
          example: 25000
