              properties:
                email:
                  type: string
      responses:
        "200":
          description: Gửi OTP thành công
        "400":
          description: Email không hợp lệ hoặc tài khoản đã xác thực
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/resend-verify-email:
    post:
      summary: Gửi lại mã OTP xác thực Email cho Khách hàng (Alias đường dẫn gốc)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Gửi OTP thành công
        "400":
          description: Email không hợp lệ hoặc tài khoản đã xác thực
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
