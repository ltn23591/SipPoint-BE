        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/export/employees:
    get:
      summary: Xuất danh sách nhân viên ra Excel
      tags:
        - Exports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: File excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu quyền Admin**: Cần đăng nhập tài khoản Admin và lấy Token dán vào nút **Authorize** ở trên cùng bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/upload/local:
    post:
      summary: Tải lên một hình ảnh (Lưu local)
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Tải lên thành công
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        4. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/upload/cloudinary/url:
