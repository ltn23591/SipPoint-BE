      summary: Xác nhận OTP để chính thức BẬT 2FA
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
      responses:
        "200":
          description: Kích hoạt 2FA thành công
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        4. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/2fa/login:
    post:
      summary: Nhập mã OTP để đăng nhập khi có 2FA
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        "200":
          description: Đăng nhập thành công, trả về token
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/2fa/disable:
    post:
      summary: Tắt tính năng bảo mật 2 lớp
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tắt 2FA thành công
      description: |-
        ### Cách kiểm thử (How to test):
        1. **Yêu cầu Token**: Hãy chắc chắn bạn đã đăng nhập và dán Token vào nút **Authorize** màu xanh ở góc trên bên phải.
        2. Nhấp chọn nút **Try it out** ở góc phải của API.
        3. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        4. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/forgot-password:
    post:
      summary: Yêu cầu khôi phục mật khẩu Nhân viên (Gửi mã OTP)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Mã OTP đã được gửi và trả về activationToken
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/verify-otp:
    post:
      summary: Xác thực mã OTP và sinh Reset Token cho nhân viên
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - activation_token
                - activation_code
              properties:
                activation_token:
                  type: string
                  description: Token nhận từ API forgot-password
                activation_code:
                  type: string
                  description: Mã OTP 6 số gửi qua Email
      responses:
        "200":
          description: OTP xác minh thành công và nhận resetToken
      description: |-
        ### Cách kiểm thử (How to test):
        1. Nhấp chọn nút **Try it out** ở góc phải của API.
        2. Kiểm tra hoặc nhập dữ liệu đầu vào phù hợp trong phần **Request Body**.
        3. Nhấp **Execute** để gửi yêu cầu và nhận kết quả trả về phía dưới.
  /api/v1/auth/reset-password:
    post:
      summary: Đặt lại mật khẩu nhân viên với Reset Token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - newPassword
              properties:
                resetToken:
                  type: string
                  description: Reset token nhận được từ API verify-otp
                newPassword:
                  type: string
                  minLength: 6
                  description: Mật khẩu mới (tối thiểu 6 ký tự)
      responses:
        "200":
          description: Đặt lại mật khẩu thành công
      description: |-
